name: ci

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            detector/requirements.txt
            pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: noexit/package-lock.json

      - name: Cache solc binaries
        uses: actions/cache@v4
        with:
          path: ~/.solc-select/artifacts
          key: solc-${{ runner.os }}-${{ hashFiles('detector/solc_versions.txt') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' -r detector/requirements.txt

      - name: Install pinned solc set (detector/solc_versions.txt)
        run: |
          for v in $(cat detector/solc_versions.txt); do
            if [ ! -f "$HOME/.solc-select/artifacts/solc-$v/solc-$v" ]; then
              solc-select install "$v"
            fi
          done

      - name: Build noexit
        run: cd noexit && npm ci --ignore-scripts && npx tsc -p tsconfig.json

      - name: Unit + corpus tests
        run: pytest tests -q -p no:cacheprovider

      - name: Fixture compile check (Tier 0 / 1 / 3)
        run: bench validate --tier 0 --tier 1 --tier 3

      - name: Judge smoke on the public set (local backend)
        env:
          DETECTOR_PYTHON: python
          JUDGE_SMOKE_REQUIRE_ENGINES: detector,noexit
        run: |
          mkdir -p in
          cp cases/tier0_judge/*/*.sol in/
          scripts/judge_smoke.sh in

  ensemble-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ensemble image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          build-args: BASE=ghcr.io/sdh2222/trust404-detector:latest
          tags: trust404/ensemble:ci

      - name: Hardened ensemble smoke
        run: |
          set -euo pipefail
          pip install check-jsonschema
          mkdir -p in
          cp cases/tier0_judge/*/*.sol in/
          docker run --rm --network none -e ENSEMBLE_MODE=judge \
            -v "$PWD/in":/input:ro trust404/ensemble:ci > out1.json 2> err1.txt
          docker run --rm --network none --user 1000:1000 \
            -e ENSEMBLE_MODE=judge \
            -v "$PWD/in":/input:ro trust404/ensemble:ci > out2.json 2> err2.txt
          docker run --rm --network none --user 65534:65534 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 4g --cpus 2 --pids-limit 512 \
            -e ENSEMBLE_MODE=judge \
            -v "$PWD/in":/input:ro trust404/ensemble:ci > out3.json 2> err3.txt
          check-jsonschema --schemafile detector/schema/judge.schema.json out1.json
          check-jsonschema --schemafile detector/schema/judge.schema.json out2.json
          check-jsonschema --schemafile detector/schema/judge.schema.json out3.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          def check(path: str) -> None:
              obj = json.loads(Path(path).read_text(encoding="utf-8"))
              assert isinstance(obj, list) and len(obj) == 5, path
              for row in obj:
                  name = row["file"]
                  verdict = row["verdict"]
                  if name.startswith("P1") or name.startswith("P4"):
                      assert verdict == "BENIGN", (path, name, verdict)
                  elif name.startswith("P2") or name.startswith("P3") or name.startswith("P5"):
                      assert verdict == "MALICIOUS", (path, name, verdict)
                  else:
                      raise AssertionError((path, name))

          for path in ("out1.json", "out2.json", "out3.json"):
              check(path)
          PY
          for n in 1 2 3; do
            grep -q '\[ensemble\] detector: 5 rows' "err${n}.txt"
            grep -q '\[ensemble\] noexit: 5 rows' "err${n}.txt"
            ! grep -q DEGRADED "err${n}.txt"
          done
          cmp out1.json out2.json && cmp out1.json out3.json
