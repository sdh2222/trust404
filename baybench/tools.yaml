# BAYBENCH tool registry. Each tool has `name` and either `image` (docker mode) or `cmd` (--no-docker mode; {input} and {output} are substituted).
tools:
  - name: baseline_keyword
    image: baybench/baseline_keyword:latest
    cmd: ".venv/bin/python tools/baseline_keyword/tool.py {input} {output}/results.json"
  - name: baseline_slither
    image: baybench/baseline_slither:latest
    cmd: ".venv/bin/python tools/baseline_slither/tool.py {input} {output}/results.json"
  - name: probe_network
    image: baybench/probe_network:latest
    cmd: ".venv/bin/python tools/probe_network/tool.py {input} {output}/results.json"
  - name: detector
    image: trust404/detector:latest
    cmd: ".venv/bin/python -m detector.cli {input} {output}/results.json"
  - name: noexit
    image: t404/noexit:latest
    # vendored teammate engine (noexit/UPSTREAM); build first: cd noexit && npm ci --ignore-scripts && npx tsc -p tsconfig.json
    cmd: "node noexit/dist/baybench.js {input} {output}/results.json"
  - name: ensemble
    image: trust404/ensemble:latest
    # both engines merged (docs/specs/ensemble.md); needs noexit/dist built and the detector venv
    cmd: ".venv/bin/python tools/ensemble.py --bench-out {output}/results.json {input}"
